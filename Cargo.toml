[workspace]
resolver = "3"
members = ["crates/*", "nodes/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mhussainahmad/ruro"
authors = ["Hussain Ahmad <emhussain25@gmail.com>"]
homepage = "https://github.com/mhussainahmad/ruro"
readme = "README.md"

[workspace.dependencies]
ruro = { version = "0.1.0", path = "crates/ruro" }
ruro-msg = { version = "0.1.0", path = "crates/ruro-msg" }
ruro-macros = { version = "0.1.0", path = "crates/ruro-macros" }
ruro-node = { version = "0.1.0", path = "crates/ruro-node" }
ruro-graph = { version = "0.1.0", path = "crates/ruro-graph" }
ruro-transport = { version = "0.1.0", path = "crates/ruro-transport" }
ruro-proto = { version = "0.1.0", path = "crates/ruro-proto" }
ruro-host = { version = "0.1.0", path = "crates/ruro-host" }
ruro-daemon = { version = "0.1.0", path = "crates/ruro-daemon" }
ruro-nodes-std = { version = "0.1.0", path = "nodes/ruro-nodes-std" }
ruro-nodes-hw = { version = "0.1.0", path = "nodes/ruro-nodes-hw" }
ruro-nodes-sim = { version = "0.1.0", path = "nodes/ruro-nodes-sim" }
ruro-nodes-ml = { version = "0.1.0", path = "nodes/ruro-nodes-ml" }
ruro-urdf = { version = "0.1.0", path = "crates/ruro-urdf" }
ruro-schema = { version = "0.1.0", path = "crates/ruro-schema" }
ruro-tf = { version = "0.1.0", path = "crates/ruro-tf" }
ruro-pkg = { version = "0.1.0", path = "crates/ruro-pkg" }
ruro-py = { version = "0.1.0", path = "crates/ruro-py" }
ruro-ros2 = { version = "0.1.0", path = "crates/ruro-ros2" }
ruro-nodes-ros2 = { version = "0.1.0", path = "nodes/ruro-nodes-ros2" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = "1.3"
postcard = { version = "1", features = ["use-std"] }
inventory = "0.3"
parking_lot = "0.12"
crossbeam-channel = "0.5"
clap = { version = "4.6", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
iceoryx2 = "0.10"
zenoh = { version = "1.10", default-features = false, features = ["transport_tcp", "transport_unixsock-stream"] }
libc = "0.2"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.36"
egui-snarl = "0.12"
egui_plot = "0.37"
criterion = "0.7"
indexmap = { version = "2", features = ["serde"] }
signal-hook = "0.3"
serialport = { version = "4.7", default-features = false }
zune-jpeg = "0.5.15"
roxmltree = "0.21"
libloading = "0.8"
openh264 = { version = "0.9.9", default-features = false, features = ["source"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-rustls", "api-24"] }
arrow-array = "57"
arrow-schema = "57"
parquet = { version = "57", default-features = false, features = ["arrow", "snap"] }
png = "0.18"
sha2 = "0.10"
toml = "1"
tempfile = "3"
pyo3 = "0.29"
pyo3-build-config = "0.29"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

[profile.dev]
debug = "line-tables-only"
# Incremental artifacts for a workspace this size run to many gigabytes.
incremental = false

[profile.dev.package."*"]
opt-level = 2
debug = false
