name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  cross:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            gcc: gcc-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Cross toolchain
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.gcc }}
      # The linker for each target is set in .cargo/config.toml.
      - name: Build CLI and host
        run: cargo build --release --locked --target ${{ matrix.target }} -p ruro-cli -p ruro-host
      - uses: actions/upload-artifact@v4
        with:
          name: ruro-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/ruro
            target/${{ matrix.target }}/release/ruro-host
          if-no-files-found: error

  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.4.52'
      - name: Copy screenshots into the book
        run: mkdir -p book/src/images && cp docs/images/*.png book/src/images/
      - run: mdbook build book
      - uses: actions/upload-artifact@v4
        with:
          name: book
          path: book/book

  package:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev dpkg-dev
      - name: Build .deb
        run: scripts/package-deb.sh
      - name: Inspect package
        run: |
          dpkg-deb --info target/package/*.deb
          dpkg-deb --contents target/package/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/package/*.deb
          if-no-files-found: error

  docker:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ruro:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
