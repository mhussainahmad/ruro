[package]
name = "ruro-proto"
description = "Control-plane protocol shared by ruro daemon, hosts and clients"
keywords = ["robotics", "zenoh", "protocol", "dataflow"]
categories = ["science::robotics", "network-programming"]
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ruro-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
libc = { workspace = true }
ruro-msg = { workspace = true }
ruro-graph = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
zenoh = { workspace = true, features = ["transport_tls", "auth_usrpwd"] }
# 0.12.1: decompressing invalid data could expose memory (RUSTSEC-2026-0041).
lz4_flex = "0.12.1"
anyhow = { workspace = true }
serde_json = { workspace = true }
