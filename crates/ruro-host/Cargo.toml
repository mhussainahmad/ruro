[package]
name = "ruro-host"
description = "Process that executes a group of ruro nodes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "ruro-host"
path = "src/main.rs"

[dependencies]
ruro-msg = { workspace = true }
ruro-node = { workspace = true }
ruro-graph = { workspace = true }
ruro-proto = { workspace = true }
ruro-transport = { workspace = true }
ruro-record = { path = "../ruro-record" }
ruro-nodes-std = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zenoh = { workspace = true }
signal-hook = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
ruro = { workspace = true }
ruro-daemon = { workspace = true }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
sha2 = "0.10"
