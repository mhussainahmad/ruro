# SO-100 arm simulated in MuJoCo, teleoperated with a gamepad, recording a
# LeRobot dataset. arm-real.yaml is the same graph with the real arm and
# camera: only the `arm` and `camera` nodes differ, everything downstream is
# identical. See book/src/sim-to-real.md.
#
# Needs a host built with the MuJoCo and LeRobot features and the MuJoCo
# library. Model paths are relative to the working directory of the daemon
# (hosts inherit it), so start the daemon from the repository root or use
# absolute paths:
#   cargo build --release -p ruro-host --features ruro-nodes-sim/mujoco,ruro-nodes-ml/lerobot
#   RURO_MUJOCO_LIB=/path/to/libmujoco.so ruro run examples/arm-sim.yaml
#
# The graph runs on simulated time: `arm` publishes the MuJoCo clock on its
# std/Clock output and every timer (jogging, the recorder's frame rate) steps
# on it, so a slow or paused simulation slows the whole graph down with it.
# arm-real.yaml runs on the wall clock.
name: arm-sim
clock: sim
nodes:
  # --- robot: simulated ---
  arm:
    type: sim/mujoco
    group: robot
    rate: 100
    params: { model: examples/models/so100.xml, real_time_factor: 1.0 }
    pos: [400, 0]
  camera:
    type: std/fake-camera
    group: robot
    rate: 30
    params: { width: 640, height: 480 }
    pos: [400, 260]
  # --- shared downstream nodes ---
  gamepad:
    type: hw/gamepad
    rate: 100
    pos: [0, 0]
  jog:
    type: hw/joint-jog
    rate: 50
    params:
      axes: "0,1,4,3,6,7"
      lower: "-2,-1.8,-1.7,-1.8,-3,0"
      upper: "2,1.8,1.7,1.8,3,1.5"
    pos: [200, 0]
  kinematics:
    type: sim/robot-state
    params: { model: examples/models/so100.xml }
    pos: [700, 0]
  recorder:
    type: ml/lerobot-recorder
    rate: 30
    params:
      root: datasets/so100-sim
      fps: 30
      task: "move the arm around"
      robot_type: so100
      camera: front
      joint_names: "shoulder_pan,shoulder_lift,elbow_flex,wrist_flex,wrist_roll,gripper"
      auto_start: true
      episode_seconds: 30
    pos: [700, 200]
wires:
  - gamepad.joy -> jog.joy
  - arm.state -> jog.state
  - jog.command -> arm.command
  - arm.state -> kinematics.joints
  - arm.state -> recorder.state
  - jog.command -> recorder.action
  - camera.image -> recorder.image
