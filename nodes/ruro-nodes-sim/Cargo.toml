[package]
name = "ruro-nodes-sim"
description = "Simulation nodes for ruro: MuJoCo and URDF/MJCF kinematics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# `sim/mujoco`: loads libmujoco at run time (see RURO_MUJOCO_LIB).
mujoco = ["dep:libloading"]

[dependencies]
ruro = { workspace = true }
serde = { workspace = true }
ruro-urdf = { workspace = true }
libloading = { workspace = true, optional = true }

[dev-dependencies]
ruro-graph = { workspace = true }
# Path only: ruro-host depends on this crate, so the dev-dependency is left
# out of the published package.
ruro-host = { path = "../../crates/ruro-host" }
parking_lot = { workspace = true }
