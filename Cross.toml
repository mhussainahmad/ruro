# Configuration for `cross` (https://github.com/cross-rs/cross).
#
#   cargo install cross --locked
#   cross build --release --target aarch64-unknown-linux-gnu -p ruro-cli -p ruro-host
#
# Building the studio for ARM also needs the target's windowing libraries,
# which the pre-build step installs.

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update",
    "apt-get install -y --no-install-recommends libclang-dev clang libxkbcommon-dev:$CROSS_DEB_ARCH libwayland-dev:$CROSS_DEB_ARCH libgl1-mesa-dev:$CROSS_DEB_ARCH",
]
