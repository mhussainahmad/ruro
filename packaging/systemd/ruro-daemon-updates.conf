# Drop-in for ruro-daemon.service that lets `ruro update` replace the daemon.
#
# The packaged binaries in /usr/bin belong to root and are read-only to the
# service, so the daemon runs from copies in a directory the `ruro` user
# owns. An update replaces them there and keeps the previous ones as
# ruro.prev and ruro-host.prev. See the book's "Updating daemons" page.
#
#   sudo install -d -o ruro -g ruro /var/lib/ruro/bin
#   sudo install -o ruro -g ruro /usr/bin/ruro /usr/bin/ruro-host /var/lib/ruro/bin/
#   sudo install -Dm644 /usr/share/ruro/systemd/ruro-daemon-updates.conf \
#       /etc/systemd/system/ruro-daemon.service.d/updates.conf
#   # list the public keys of your signing keys (ruro keygen) in:
#   sudo install -Dm644 signing.pub /etc/ruro/update-keys
#   sudo systemctl daemon-reload && sudo systemctl restart ruro-daemon
#
# Upgrading the .deb package afterwards does not touch these copies.

[Service]
Environment=RURO_UPDATE_KEYS=/etc/ruro/update-keys
ExecStart=
ExecStart=/var/lib/ruro/bin/ruro daemon --listen ${RURO_LISTEN}
