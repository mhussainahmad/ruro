name: CI

on:
  push:
    branches: [main, 'ports/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # ruro-py and ruro-host-py embed Python through pyo3, so building or testing
  # the whole workspace needs a Python with its shared library. The ruro Python
  # package requires 3.11 or newer.
  PYTHON_VERSION: '3.12'

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: clippy and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy (workspace, default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Optional node features that the default build leaves out. `onnx`
      # downloads a CPU build of ONNX Runtime; `mujoco` and `realsense` only
      # load their libraries at run time, so they build without them; `h264`
      # compiles OpenH264's bundled source.
      - name: Clippy (optional node features)
        run: >
          cargo clippy --locked --all-targets
          -p ruro-nodes-ml -p ruro-nodes-sim -p ruro-nodes-hw
          --features ruro-nodes-ml/onnx,ruro-nodes-ml/lerobot,ruro-nodes-sim/mujoco,ruro-nodes-hw/h264,ruro-nodes-hw/realsense
          -- -D warnings
      - name: Test (workspace, default features)
        env:
          # The C and C++ plugin tests compile with cc and c++; fail rather
          # than skip if they cannot.
          RURO_REQUIRE_PLUGINS: 1
        run: cargo test --workspace --locked
      # The MuJoCo and RealSense library tests are skipped unless their
      # libraries are present; the ONNX, LeRobot and H.264 tests run here.
      - name: Test (optional node features)
        run: >
          cargo test --locked
          -p ruro-nodes-ml -p ruro-nodes-sim -p ruro-nodes-hw
          --features ruro-nodes-ml/onnx,ruro-nodes-ml/lerobot,ruro-nodes-sim/mujoco,ruro-nodes-hw/h264,ruro-nodes-hw/realsense

  msrv:
    # Keep in sync with `rust-version` in the workspace Cargo.toml.
    name: check (Rust 1.95)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --locked

  python:
    name: python package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          # The oldest Python the package supports (requires-python >= 3.11).
          python-version: '3.11'
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the extension and run the tests
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install 'maturin>=1.9,<2'
          maturin develop --locked -m crates/ruro-py/Cargo.toml --extras test
          cd crates/ruro-py && pytest

  octave:
    # Nodes in other languages: the MATLAB helper (sdk/matlab) and the
    # example nodes, under GNU Octave, over stdio and over TCP as MATLAB uses.
    name: process nodes in octave
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Octave
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          octave octave-instrument-control
      - name: Test
        env:
          RURO_REQUIRE_OCTAVE: 1
        run: cargo test --locked -p ruro-nodes-process --test octave

  cross:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            # g++ for the C++ test plugins, which the tests compile for the
            # target and load under emulation.
            gcc: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The linker for each target is set in .cargo/config.toml; the cc crate
      # (ring, zstd) picks the same cross compiler by its target prefix.
      - name: Cross toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ matrix.gcc }}
      - name: Build CLI and host
        run: cargo build --release --locked --target ${{ matrix.target }} -p ruro-cli -p ruro-host
      # The tests run under user-mode emulation. Binaries the tests start
      # themselves (daemons, hosts) go through binfmt, which does not pass
      # -L, hence QEMU_LD_PREFIX. Skipped: one test reads /proc/<pid>/exe,
      # which is qemu under emulation. The Python crates need a libpython for
      # the target, and the studio is not built for it.
      - name: Emulator
        run: >
          sudo apt-get install -y --no-install-recommends qemu-user qemu-user-binfmt
          && test -e /proc/sys/fs/binfmt_misc/qemu-aarch64
      - name: Test under emulation
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
          QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
          RURO_TEST_CC: aarch64-linux-gnu-gcc
          RURO_TEST_CXX: aarch64-linux-gnu-g++
          RURO_REQUIRE_PLUGINS: 1
          # Emulated daemons and hosts are slow; fewer at once keeps the
          # tests' timing assumptions within reach.
          RUST_TEST_THREADS: 2
        # Failing tests are also reported as annotations, which can be read
        # without access to the log.
        run: |
          # A hung test is named by libtest after 60 s; the timeout ends the
          # run so that the name gets reported. The log goes to a file: a
          # process left behind by a test would hold a pipe open.
          status=0
          timeout -k 30s 30m cargo test --locked --target ${{ matrix.target }} --no-fail-fast \
            --workspace --exclude ruro-py --exclude ruro-host-py --exclude ruro-studio \
            -- --skip uploaded_host_binaries_run_groups >test.log 2>&1 </dev/null || status=$?
          cat test.log
          ps -eo pid,ppid,etime,args | grep -E "ruro|qemu|deps/" | grep -v grep | sed 's/^/::warning::left running: /' || true
          if [ "$status" != 0 ]; then
            # One annotation (lines joined by %0A): a step keeps only a few.
            {
              echo "cargo test exited with $status (124: timed out)"
              echo "last started: $(grep -E '^ +Running ' test.log | tail -1)"
              for t in $(sed -n 's/^test \(.*\) has been running for over 60 seconds$/\1/p' test.log); do
                grep -qE "^test $t \.\.\. " test.log || echo "never finished: $t"
              done
              grep -E "^test .* FAILED$|^error: |^    \`" test.log
              grep -E -A3 "panicked at" test.log | head -40
            } | head -80 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error::/'
            echo
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ruro-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/ruro
            target/${{ matrix.target }}/release/ruro-host
          if-no-files-found: error

  book:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.4.52'
      - run: mdbook build book
      - uses: actions/upload-artifact@v4
        with:
          name: book
          path: book/book

  desktop-files:
    name: desktop file and metadata
    # AppStream 1.0 (Ubuntu 24.04) understands the metainfo's <developer id>.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validation tools
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          desktop-file-utils appstream
      - name: Validate
        run: |
          desktop-file-validate packaging/linux/io.github.mhussainahmad.ruro.Studio.desktop
          appstreamcli validate --no-net packaging/linux/io.github.mhussainahmad.ruro.Studio.metainfo.xml

  package:
    name: debian package
    # Release builds of the studio take a while; skip them on pull requests.
    if: github.event_name != 'pull_request'
    # The oldest supported Ubuntu, so the package's glibc requirement stays low.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev
      - name: Build .deb
        run: scripts/package-deb.sh
      - name: Inspect package
        run: |
          dpkg-deb --info target/package/*.deb
          dpkg-deb --contents target/package/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/package/*.deb
          if-no-files-found: error

  package-python:
    # ruro-python, the host for Python nodes, links the libpython of the
    # release it is built on: Ubuntu 24.04 (Python 3.12). Both packages are
    # installed and the Python example graph is run through the daemon.
    name: python debian package
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev python3-dev
      - name: Build both .debs
        env:
          PYO3_PYTHON: /usr/bin/python3
        run: scripts/package-deb.sh && scripts/package-deb-python.sh
      - name: Install and run the Python example
        run: |
          dpkg-deb --info target/package/ruro-python_*.deb
          sudo apt-get install -y ./target/package/ruro_*.deb ./target/package/ruro-python_*.deb
          scripts/test-python-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb-python
          path: target/package/ruro-python_*.deb
          if-no-files-found: error

  docker:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ruro:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
