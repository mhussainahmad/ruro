name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # ruro-py and ruro-host-py embed Python through pyo3, so building or testing
  # the whole workspace needs a Python with its shared library. The ruro Python
  # package requires 3.11 or newer.
  PYTHON_VERSION: '3.12'

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: clippy and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy (workspace, default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Optional node features that the default build leaves out. `onnx`
      # downloads a CPU build of ONNX Runtime; `mujoco` only loads libmujoco at
      # run time, so it builds without MuJoCo installed.
      - name: Clippy (optional node features)
        run: >
          cargo clippy --locked --all-targets
          -p ruro-nodes-ml -p ruro-nodes-sim
          --features ruro-nodes-ml/onnx,ruro-nodes-ml/lerobot,ruro-nodes-sim/mujoco
          -- -D warnings
      - name: Test (workspace, default features)
        run: cargo test --workspace --locked
      # The MuJoCo tests are skipped unless RURO_MUJOCO_LIB is set, so only the
      # ONNX and LeRobot tests run here.
      - name: Test (optional node features)
        run: >
          cargo test --locked
          -p ruro-nodes-ml -p ruro-nodes-sim
          --features ruro-nodes-ml/onnx,ruro-nodes-ml/lerobot,ruro-nodes-sim/mujoco

  msrv:
    # Keep in sync with `rust-version` in the workspace Cargo.toml.
    name: check (Rust 1.95)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --locked

  python:
    name: python package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          # The oldest Python the package supports (requires-python >= 3.11).
          python-version: '3.11'
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the extension and run the tests
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install 'maturin>=1.9,<2'
          maturin develop --locked -m crates/ruro-py/Cargo.toml --extras test
          cd crates/ruro-py && pytest

  cross:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            gcc: gcc-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The linker for each target is set in .cargo/config.toml; the cc crate
      # (ring, zstd) picks the same cross compiler by its target prefix.
      - name: Cross toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ matrix.gcc }}
      - name: Build CLI and host
        run: cargo build --release --locked --target ${{ matrix.target }} -p ruro-cli -p ruro-host
      - uses: actions/upload-artifact@v4
        with:
          name: ruro-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/ruro
            target/${{ matrix.target }}/release/ruro-host
          if-no-files-found: error

  book:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.4.52'
      - run: mdbook build book
      - uses: actions/upload-artifact@v4
        with:
          name: book
          path: book/book

  package:
    name: debian package
    # Release builds of the studio take a while; skip them on pull requests.
    if: github.event_name != 'pull_request'
    # The oldest supported Ubuntu, so the package's glibc requirement stays low.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Packaging tools
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          dpkg-dev desktop-file-utils appstream
      - name: Validate desktop file and metadata
        run: |
          desktop-file-validate packaging/linux/io.github.mhussainahmad.ruro.Studio.desktop
          appstreamcli validate --no-net packaging/linux/io.github.mhussainahmad.ruro.Studio.metainfo.xml
      - name: Build .deb
        run: scripts/package-deb.sh
      - name: Inspect package
        run: |
          dpkg-deb --info target/package/*.deb
          dpkg-deb --contents target/package/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/package/*.deb
          if-no-files-found: error

  docker:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ruro:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
