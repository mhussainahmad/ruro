# The real SO-100 arm (Feetech STS3215 servos) and a USB camera, with the
# same downstream nodes as arm-sim.yaml. See docs/sim-to-real.md.
#
# Calibrate first: `offsets` are the raw servo readings (0..4095) with the arm
# pointing straight up and the gripper closed; flip `directions` for joints
# that turn the wrong way compared with the simulation.
#   cargo build --release -p ruro-host --features ruro-nodes-ml/lerobot
#   ruro run examples/arm-real.yaml
name: arm-real
nodes:
  # --- robot: real hardware ---
  arm:
    type: hw/so100-arm
    group: robot
    rate: 100
    params:
      device: /dev/ttyACM0
      baud: 1000000
      ids: "1,2,3,4,5,6"
      offsets: "2048,2048,2048,2048,2048,2048"
      directions: "1,1,1,1,1,1"
      max_step: 0.3
    pos: [400, 0]
  camera:
    type: hw/v4l2-camera
    group: robot
    rate: 30
    params: { device: /dev/video0, width: 640, height: 480, fps: 30 }
    pos: [400, 260]
  # --- shared downstream nodes ---
  gamepad:
    type: hw/gamepad
    rate: 100
    pos: [0, 0]
  jog:
    type: hw/joint-jog
    rate: 50
    params:
      axes: "0,1,4,3,6,7"
      lower: "-2,-1.8,-1.7,-1.8,-3,0"
      upper: "2,1.8,1.7,1.8,3,1.5"
    pos: [200, 0]
  kinematics:
    type: sim/robot-state
    params: { model: examples/models/so100.xml }
    pos: [700, 0]
  recorder:
    type: ml/lerobot-recorder
    rate: 30
    params:
      root: datasets/so100-real
      fps: 30
      task: "move the arm around"
      robot_type: so100
      camera: front
      joint_names: "shoulder_pan,shoulder_lift,elbow_flex,wrist_flex,wrist_roll,gripper"
      auto_start: true
      episode_seconds: 30
    pos: [700, 200]
wires:
  - gamepad.joy -> jog.joy
  - arm.state -> jog.state
  - jog.command -> arm.command
  - arm.state -> kinematics.joints
  - arm.state -> recorder.state
  - jog.command -> recorder.action
  - camera.image -> recorder.image
