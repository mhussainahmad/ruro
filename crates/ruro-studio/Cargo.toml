[package]
name = "ruro-studio"
description = "Native desktop editor for ruro graphs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "ruro-studio"
path = "src/main.rs"

[dependencies]
ruro-msg = { workspace = true }
ruro-graph = { workspace = true }
ruro-proto = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zenoh = { workspace = true }
crossbeam-channel = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui-snarl = { workspace = true }
egui_plot = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ruro-node = { workspace = true }
ruro-nodes-std = { workspace = true }
