[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "ruro"
description = "Write nodes for the ruro robotics dataflow runtime in Python"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Hussain Ahmad", email = "emhussain25@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version"]

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
test = ["numpy>=1.24", "pytest>=7"]

[project.urls]
Repository = "https://github.com/mhussainahmad/ruro"

[tool.maturin]
python-source = "python"
module-name = "ruro._native"
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
