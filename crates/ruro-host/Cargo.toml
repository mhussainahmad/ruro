[package]
name = "ruro-host"
description = "Process that executes a group of ruro nodes"
keywords = ["robotics", "dataflow", "runtime"]
categories = ["science::robotics", "command-line-utilities"]
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ruro-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "ruro-host"
path = "src/main.rs"

[dependencies]
ruro-msg = { workspace = true }
ruro-node = { workspace = true }
ruro-graph = { workspace = true }
ruro-proto = { workspace = true }
ruro-ros2 = { workspace = true }
ruro-transport = { workspace = true }
ruro-record = { workspace = true }
ruro-nodes-std = { workspace = true }
ruro-nodes-hw = { workspace = true }
ruro-nodes-sim = { workspace = true }
ruro-nodes-ml = { workspace = true }
ruro-nodes-ros2 = { workspace = true }
ruro-nodes-gpu = { workspace = true }
ruro-nodes-process = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zenoh = { workspace = true }
signal-hook = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
ruro = { workspace = true }
ruro-daemon = { workspace = true }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
sha2 = "0.10"

[[bench]]
name = "jitter"
harness = false
